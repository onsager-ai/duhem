# Native runs gate the run, never satisfy criteria — worked example (#649).
# Run from the repository root with Node 24 on PATH:
#   duhem run verifications/native-example
verification: Native greeting example

inputs:
  repo_dir: {type: string, default: .}

native:
  - id: greeting-smoke
    layer: integration
    cwd: project
    command: [node, cli.mjs, Ada]
    expect:
      exit_code: 0
      stdout: {matches: '^Hello, Ada!\n$'}
      stderr: {not_matches: '(?i)error'}
  - id: greeting-unit
    layer: unit
    cwd: project
    command: [node, --test, --test-reporter=junit, --test-reporter-destination=junit.xml, greet.test.mjs]
    report: {format: junit, path: junit.xml}

criteria:
  - id: GREETING
    description: The greeting CLI welcomes the visitor by name.
    checks:
      - id: GREETING.1
        steps:
          - id: greet
            uses: cli/invoke
            with:
              command: [node, verifications/native-example/project/cli.mjs, Ada]
              cwd: $inputs.repo_dir
        assertions:
          - $steps.greet.outputs.exit_code == 0
          - $steps.greet.outputs.stdout == "Hello, Ada!\n"
