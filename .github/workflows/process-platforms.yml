name: owned process platforms
on:
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/process-platforms.yml']
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/process-platforms.yml']
concurrency:
  group: process-platforms-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  RUSTFLAGS: -D warnings
  # These fixtures bind real loopback listeners; host proxy configuration
  # must not send their requests outside the runner.
  NO_PROXY: 127.0.0.1,localhost
jobs:
  process-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Permit the fixture interpreter through the macOS application firewall
        if: runner.os == 'macOS'
        shell: bash
        run: |
          fixture_python=$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.executable).resolve())')
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --add "$fixture_python"
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --unblockapp "$fixture_python"
      # Temporary diagnosis for the macOS HTTP readiness boundary.
      - name: Direct loopback fixture probe (temporary)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 -u crates/duhem-runtime/tests/fixtures/process.py server "$RUNNER_TEMP/direct-state" 18769 > "$RUNNER_TEMP/direct-http.log" 2>&1 &
          fixture_pid=$!
          trap 'cat "$RUNNER_TEMP/direct-http.log"; kill "$fixture_pid"; wait "$fixture_pid" || true' EXIT
          curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 -H 'X-Ready: yes' http://127.0.0.1:18769/health
          cat "$RUNNER_TEMP/direct-http.log"
      - run: cargo test -p duhem-runtime --test owned_processes
