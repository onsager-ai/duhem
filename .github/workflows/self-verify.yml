# Self-verify — Duhem-on-Duhem regression coverage (epic #148).
#
# Core CLI regression, native examples, and validation of every in-tree suite
# now run through the root duhem.yml in CI's two-way `duhem run` job. That job
# runs on every PR/push to main, including changes to this workflow, the root
# manifest, scripts, toolchain, and verification definitions.
#
# This workflow retains dashboard-regression (SPA + Chromium), sharding-example,
# and verify-sharding-partition. Duhem verifying Duhem is regression coverage,
# not an independent trust anchor (docs/duhem-spec.md §11.2).
#
# The `changes` filter deliberately keeps the sharding lane broad (crates/** and
# verifications/**) while dashboard-regression stays narrow: its SPA build and
# Chromium install are expensive. Preserve that asymmetry.

name: self-verify

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'verifications/**'
      - 'duhem.yml'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/self-verify.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'verifications/**'
      - 'duhem.yml'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/self-verify.yml'

concurrency:
  group: self-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Every completed invocation replicates its tree; delivery never gates CI.
  DUHEM_SERVER_URL: ${{ vars.DUHEM_SERVER_URL }}
  DUHEM_SERVER_TOKEN: ${{ secrets.DUHEM_SERVER_TOKEN }}

jobs:
  # Per-lane path scoping. Workflow-level `on.paths` only decides
  # whether the workflow runs at all; this filter decides which lane(s)
  # actually execute, so each lane stays a fast, targeted gate.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cli:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'verifications/**'
              - 'duhem.yml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/self-verify.yml'
            dashboard:
              - 'crates/duhem-dashboard/**'
              - 'verifications/duhem-dashboard/**'
              - '.github/workflows/self-verify.yml'

  sharding-example:
    name: sharding example (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    env:
      DUHEM_SHARD: ${{ matrix.shard }}/2
      DUHEM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build duhem CLI
        run: cargo build --release -p duhem-cli
      - name: Run sharding example
        run: |
          ./target/release/duhem run verifications/sharding-example \
            --db "${RUNNER_TEMP}/sharding-example-${{ matrix.shard }}.db" \
            --reporter json > "${RUNNER_TEMP}/shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sharding-summary-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
          if-no-files-found: error

  verify-sharding-partition:
    name: verify sharding partition
    needs: sharding-example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sharding-summary-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Check disjoint complete partition
        env:
          SHARD_SUMMARY_DIR: ${{ runner.temp }}/shards
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os

          summaries = [
              json.load(open(path, encoding="utf-8"))
              for path in sorted(glob.glob(os.path.join(os.environ["SHARD_SUMMARY_DIR"], "shard-*.json")))
          ]
          assert len(summaries) == 2, f"expected two shard summaries, got {len(summaries)}"
          partitions = [summary["expected_partition"] for summary in summaries]
          assert all(summary["origin"] == "shard" for summary in summaries)
          assert {summary["shard"]["index"] for summary in summaries} == {1, 2}
          assert all(summary["shard"]["total"] == 2 for summary in summaries)
          expected = partitions[0]["total_units"]
          assert expected > 0
          assert all(partition["total_units"] == expected for partition in partitions)
          units = [unit for partition in partitions for unit in partition["units"]]
          assert len(units) == expected, f"partitions overlap or miss units: {len(units)} != {expected}"
          assert len(set(units)) == expected, "shard unit sets overlap"
          assert all(len(partition["units"]) > 0 for partition in partitions)
          print(f"two disjoint shards cover all {expected} expected units")
          PY

  dashboard-regression:
    name: dashboard regression
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # Mirror the `duhem/run` composite action's driver setup: Node 20
      # LTS so the SPA build + the Playwright sidecar's pinned Chromium
      # revision both match the driver.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # build.rs embeds web/dist at compile time, so the SPA MUST be
      # built before the dashboard binary — otherwise the binary serves
      # the placeholder index and AC-2's SPA-render assertions fail.
      - name: Build dashboard SPA bundle
        working-directory: crates/duhem-dashboard/web
        run: |
          npm ci
          npm run build

      - name: Build duhem + duhem-dashboard
        run: cargo build --release -p duhem-cli -p duhem-dashboard

      - name: Run bundle ingest worked example against the real dashboard
        run: |
          # Own store: the duhem-dashboard VD below counts the roots in .duhem/duhem.db.
          ./target/release/duhem run verifications/bundle-ingest-example \
            --db .duhem/bundle-ingest.db \
            --inputs duhem_bin="$PWD/target/release/duhem" \
            --inputs dashboard_bin="$PWD/target/release/duhem-dashboard" \
            --inputs store="${RUNNER_TEMP}/bundle-ingest-example.db"

      # AC-2 drives the real SPA in a real browser, so install Chromium
      # the same way the `ui-smoke` lane does — the sidecar's own pinned
      # Playwright, so the Chromium revision matches the driver.
      - name: Install Playwright sidecar deps + Chromium
        working-directory: crates/duhem-actions/sidecar
        run: |
          npm ci
          npx --yes playwright install --with-deps chromium

      # `scripts/up.sh` reads DUHEM_BIN to produce the fixture run and to
      # launch `duhem server` (which resolves the sibling
      # `duhem-dashboard`). A non-pass verdict exits non-zero.
      - name: Run duhem-dashboard regression VD
        env:
          DUHEM_BIN: ${{ github.workspace }}/target/release/duhem
        run: |
          ./target/release/duhem run verifications/duhem-dashboard \
            --db .duhem/duhem.db

  eval-task-example:
    name: eval task example and Harbor adapter
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build Duhem CLI
        run: cargo build --release -p duhem-cli
      - name: Validate the worked example
        run: ./target/release/duhem validate verifications/eval-task-example
      - name: Check reference and wrong candidate verdicts
        run: |
          set -euo pipefail
          vd=verifications/eval-task-example/duhem.yml
          reference="$PWD/verifications/eval-task-example/candidates/reference"
          wrong="$PWD/verifications/eval-task-example/candidates/wrong"
          ./target/release/duhem run "$vd" --inputs "workspace=$reference" --reporter json > "$RUNNER_TEMP/reference.json"
          set +e
          ./target/release/duhem run "$vd" --inputs "workspace=$wrong" --reporter json > "$RUNNER_TEMP/wrong.json"
          wrong_status=$?
          set -e
          test "$wrong_status" -ne 0
          python3 - "$RUNNER_TEMP/reference.json" "$RUNNER_TEMP/wrong.json" <<'PY'
          import json
          import sys

          reference, wrong = (json.load(open(path, encoding="utf-8")) for path in sys.argv[1:])
          assert reference["verdict"] == "pass", reference
          assert {item["id"]: item["verdict"] for item in reference["criteria"]} == {"AC-1": "pass", "AC-2": "pass"}
          assert wrong["verdict"] == "fail", wrong
          assert {item["id"]: item["verdict"] for item in wrong["criteria"]} == {"AC-1": "fail", "AC-2": "pass"}
          PY
      - name: Check Harbor adapter pass, fail and inconclusive mapping
        env:
          DUHEM_BIN: ${{ github.workspace }}/target/release/duhem
        run: |
          set -euo pipefail
          adapter="$PWD/verifications/eval-task-example/test.sh"
          reference="$PWD/verifications/eval-task-example/candidates/reference"
          wrong="$PWD/verifications/eval-task-example/candidates/wrong"
          mkdir -p "$RUNNER_TEMP/eval-pass" "$RUNNER_TEMP/eval-fail" "$RUNNER_TEMP/eval-inconclusive"
          (cd "$RUNNER_TEMP/eval-pass" && TASK_WORKSPACE="$reference" VERIFIER_LOGS="$PWD/logs" "$adapter")
          (cd "$RUNNER_TEMP/eval-fail" && TASK_WORKSPACE="$wrong" VERIFIER_LOGS="$PWD/logs" "$adapter")
          python3 - "$RUNNER_TEMP/eval-pass/reward.json" "$RUNNER_TEMP/eval-fail/reward.json" <<'PY'
          import json
          import sys

          passed, failed = (json.load(open(path, encoding="utf-8")) for path in sys.argv[1:])
          assert passed == {"duhem": 1, "AC-1": 1, "AC-2": 1}, passed
          assert failed == {"duhem": 0, "AC-1": 0, "AC-2": 1}, failed
          PY
          test -s "$RUNNER_TEMP/eval-pass/logs/run-bundle/bundle.json"
          test -s "$RUNNER_TEMP/eval-fail/logs/run-bundle/bundle.json"
          set +e
          (cd "$RUNNER_TEMP/eval-inconclusive" && env -u TASK_WORKSPACE DUHEM_BIN="$DUHEM_BIN" VERIFIER_LOGS="$PWD/logs" "$adapter")
          inconclusive_status=$?
          set -e
          test "$inconclusive_status" -ne 0
          test ! -e "$RUNNER_TEMP/eval-inconclusive/reward.json"
          test -s "$RUNNER_TEMP/eval-inconclusive/logs/run-summary.json"
          python3 - "$RUNNER_TEMP/eval-inconclusive/logs/run-summary.json" <<'PY'
          import json
          import sys

          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          assert summary["verdict"].startswith("inconclusive"), summary
          PY
          test -s "$RUNNER_TEMP/eval-inconclusive/logs/run-bundle/bundle.json"
      - name: Check Harbor adapter score rewards
        env:
          DUHEM_BIN: ${{ github.workspace }}/target/release/duhem
        run: |
          set -euo pipefail
          adapter="$PWD/verifications/eval-task-example/test.sh"
          reference="$PWD/verifications/eval-task-example/candidates/reference"
          # Exercise score mapping with a deterministic report fixture. Run
          # and export still exercise the real CLI and its evidence store.
          cat > "$RUNNER_TEMP/duhem-with-scores" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" != "run" ]]; then
            exec "$REAL_DUHEM" "$@"
          fi
          report="$("$REAL_DUHEM" "$@")"
          python3 - "$report" <<'PY'
          import json
          import sys

          summary = json.loads(sys.argv[1])
          summary["scores"] = {
              "AC-1": {"first": {"quality": {"value": 0}, "missing": {"missing_cause": "timeout"}, "shared": {"value": 0.5}}},
              "AC-2": {"first": {"shared": {"value": 0.75}}},
          }
          print(json.dumps(summary))
          PY
          SH
          chmod +x "$RUNNER_TEMP/duhem-with-scores"
          mkdir -p "$RUNNER_TEMP/eval-scored"
          (cd "$RUNNER_TEMP/eval-scored" && TASK_WORKSPACE="$reference" VERIFIER_LOGS="$PWD/logs" REAL_DUHEM="$DUHEM_BIN" DUHEM_BIN="$RUNNER_TEMP/duhem-with-scores" "$adapter")
          python3 - "$RUNNER_TEMP/eval-scored/reward.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              reward = json.load(source)
          assert reward == {
              "duhem": 1, "AC-1": 1, "AC-2": 1, "llm_quality": 0,
              'llm_["AC-1","first","shared"]': 0.5,
              'llm_["AC-2","first","shared"]': 0.75,
          }, reward
          PY
