name: tracker vocabulary scan
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: tracker-scrub
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Detect configured authors' tracker vocabulary
        env:
          GH_TOKEN: ${{ github.token }}
          DUHEM_PRIVATE_NAMES: ${{ secrets.DUHEM_PRIVATE_NAMES }}
        run: cargo run -p xtask -- tracker-scrub

  qualification:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: xtask contracts
        run: cargo test -p xtask
      - name: One-off source audit against the pre-scrub policy (no terms logged)
        run: |
          python3 - <<'PY_AUDIT'
          import os, re, subprocess
          source = subprocess.check_output(['git', 'show', 'aff6eaf45b1af066daffbab495047563c6c22a03:xtask/src/private_vocab.rs'], text=True)
          rules = re.findall(r'"([^"]+)"', re.search(r'const PRIVATE_NAMES:.*?= &\[(.*?)\];', source, re.S).group(1))
          env = os.environ.copy()
          env['DUHEM_PRIVATE_NAMES'] = ','.join(rules)
          subprocess.run(['cargo', 'run', '-p', 'xtask', '--quiet', '--', 'source-scrub'], env=env, check=True)
          PY_AUDIT
