verification: coverage
setup:
  - id: run_setup
    uses: api/call
  - for_each: '$inputs.items'
    as: item
    max: 1
    steps:
      - id: loop_body
        uses: api/call
teardown:
  - id: run_teardown
    uses: api/call
fixtures:
  sample:
    up:
      - id: fixture_up
        uses: api/call
    down:
      - id: fixture_down
        uses: api/call
flows:
  sample:
    steps:
      - id: flow
        uses: api/call
    cleanup:
      - id: flow_cleanup
        uses: api/call
criteria:
  - id: AC-1
    description: coverage
    setup:
      - id: criterion_setup
        uses: api/call
    teardown:
      - id: criterion_teardown
        uses: api/call
    checks:
      - id: AC-1.1
        setup:
          - id: check_setup
            uses: api/call
        steps:
          - id: check_steps
            uses: api/call
        teardown:
          - id: check_teardown
            uses: api/call
        assertions: ['true']
