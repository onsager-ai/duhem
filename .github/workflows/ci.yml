name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: duhem run (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      # Keep evidence from both partitions even when one fails.
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DUHEM_SHARD: ${{ matrix.shard }}/2
      DUHEM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DUHEM_SERVER_URL: ${{ vars.DUHEM_SERVER_URL }}
      DUHEM_SERVER_TOKEN: ${{ secrets.DUHEM_SERVER_TOKEN }}
      # Native commands retain DUHEM_*; GitHub's variables are sanitized.
      DUHEM_CI_BASE_REF: ${{ github.base_ref }}
      DUHEM_CI_EVENT_NAME: ${{ github.event_name }}
      DUHEM_DX_IMPACT_NONE: ${{ contains(github.event.pull_request.body, '<!-- dx:none -->') && '1' || '' }}
      DUHEM_CHANGELOG_CLARIFYING: ${{ contains(github.event.pull_request.body, '<!-- schema:clarifying -->') && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Diff-scoped native checks need the PR base and full merge history.
          fetch-depth: 0

      # rust-toolchain.toml pins the channel + components (rustfmt + clippy).
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # node:test and its JUnit reporter ship in Node itself; no npm install.
      - name: Use Node for the native worked example and controls
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build duhem CLI
        run: cargo build -p duhem-cli

      - name: Validate core CI manifest
        run: ./target/debug/duhem validate duhem.yml

      - name: Run core CI through Duhem
        run: ./target/debug/duhem run duhem.yml --no-live --db .duhem/duhem.db

      # The owned-process VD tears this state down; preserve its former
      # post-run assertion on both machines (including a failing shard).
      - name: Check owned-process cleanup
        if: always()
        run: test ! -e .duhem/owned-process-example-state

      - name: Upload core CI evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-ci-evidence-${{ matrix.shard }}
          path: .duhem/
          include-hidden-files: true
          if-no-files-found: ignore

  # Browser-backed integration suites (`tests/ui_smoke.rs`,
  # `tests/api_observe_smoke.rs`) are `#[ignore]`d because they need a
  # real Chromium, so the core run's `cargo test` skips them. Without
  # this lane, selector-engine / sidecar-protocol breakage rides through
  # CI green — exactly how the #75 `:has-text` regression shipped. Kept a
  # distinct job so the ~4-min Chromium install doesn't slow the fast
  # Rust gate and a browser flake reads as such. (spec #77)
  ui-smoke:
    name: ui-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # Mirror the `duhem/run` composite action's driver setup: Node 20
      # LTS + the sidecar's own pinned Playwright, so the Chromium
      # revision always matches the driver.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Playwright sidecar deps + Chromium
        working-directory: crates/duhem-actions/sidecar
        run: |
          npm ci
          npx --yes playwright install --with-deps chromium

      # Action protocol coverage, the runtime capture/replay contract, and
      # session seeding against a real context; mirrors
      # `just test browser-actions` (this job has no `just`, so the ignored
      # browser suites the recipe runs are invoked directly). Adding a suite
      # to that recipe means adding it here too — the duplication is the
      # point of failure, and a suite missing here passes CI by not running.
      - name: cargo test (ignored browser suites)
        run: |
          cargo test -p duhem-actions --test ui_smoke --test api_observe_smoke --test api_observe_window_smoke --test console_observe_smoke -- --ignored
          cargo test -p duhem-runtime --test capture_smoke --test session_injection_smoke --test named_sessions_smoke --test frame_smoke --test api_smoke --test history_smoke --test keyboard_focus_smoke --test emulate_smoke --test geometry_smoke --test observe_window_masking_smoke --test console_observe_smoke --test http_page_error_masking_smoke -- --ignored

  # Exercises `duhem run`'s auto-provision (#295): a `ui/*` run with no
  # usable sidecar must fetch Chromium itself instead of hard-failing (the
  # regression this lane guards). It runs against a node_modules-less
  # sidecar copy so the #105 discovery fallback can't satisfy the launch
  # from the runner's system Chrome. Distinct from `ui-smoke`, which
  # pre-installs the browser and so never takes the auto-provision path.
  browser-autoprovision-smoke:
    name: browser-autoprovision-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Chromium's OS libraries, so the browser the run auto-provisions can
      # actually launch. No browser binary and no sidecar node_modules — the
      # run below installs Chromium itself.
      - name: Install Chromium system libs
        run: npx --yes playwright@1.61.1 install-deps chromium

      # Test browser provisioning, not an external site's content or uptime.
      - name: Write a local HTTP fixture and browser-needing VD
        run: |
          mkdir -p "${RUNNER_TEMP}/browser-fixture"
          cat > "${RUNNER_TEMP}/browser-fixture/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <meta charset="utf-8">
            <title>Duhem browser auto-provision smoke</title>
            <h1>Duhem browser auto-provision smoke</h1>
          </html>
          HTML
          cat > "${RUNNER_TEMP}/autoprovision.duhem.yml" <<'YAML'
          verification: browser auto-provision smoke (#295)
          criteria:
            - id: AP
              description: A ui/* run auto-provisions Chromium when none is installed.
              checks:
                - id: AP.1
                  description: Load the local HTTP fixture and confirm its heading is visible.
                  steps:
                    - uses: ui/navigate
                      with:
                        url: http://127.0.0.1:8765/
                    - uses: ui/assert-element
                      with:
                        locator: { role: heading, name: "Duhem browser auto-provision smoke" }
                        expected: visible
                        timeout: 15s
          YAML

      # Force the auto-provision path deterministically. GitHub runners ship
      # /usr/bin/google-chrome, which the sidecar's discovery fallback (#105)
      # would use instead of installing anything. Point DUHEM_SIDECAR_DIR at a
      # copy with NO node_modules: that sidecar can't even import Playwright,
      # so launch fails regardless of any system browser and `duhem run` must
      # auto-provision. (Removing the ms-playwright cache is not enough — the
      # #105 discovery ladder also searches PATH.)
      - name: Run — expect auto-provision, then pass
        run: |
          set -o pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "${RUNNER_TEMP}/browser-fixture" > "${RUNNER_TEMP}/fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"; wait "$fixture_pid" || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --retry-max-time 20 http://127.0.0.1:8765/ > /dev/null
          SC="${RUNNER_TEMP}/sidecar"; mkdir -p "$SC"
          cp crates/duhem-actions/sidecar/{index.mjs,package.json,package-lock.json,jsconfig.json} "$SC"/
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/autoprovision-browsers"
          test ! -e "$SC/node_modules"
          test ! -e "$PLAYWRIGHT_BROWSERS_PATH"
          DUHEM_SIDECAR_DIR="$SC" cargo run -p duhem-cli --quiet -- run "${RUNNER_TEMP}/autoprovision.duhem.yml" 2> >(tee "${RUNNER_TEMP}/run.stderr" >&2)
          grep -q "Chromium not found — installing it once" "${RUNNER_TEMP}/run.stderr" \
            || { echo "::error::auto-provision notice not emitted — the run did not take the install path"; exit 1; }
          # A system-browser fallback alone must not satisfy this test.
          (cd "$SC" && node --input-type=module -e 'import { chromium } from "playwright"; import { accessSync, constants } from "node:fs"; accessSync(chromium.executablePath(), constants.X_OK);')

      - name: Opt-out (DUHEM_NO_BROWSER_INSTALL=1) must fail fast with the hint
        run: |
          SC="${RUNNER_TEMP}/sidecar-optout"; mkdir -p "$SC"
          cp crates/duhem-actions/sidecar/{index.mjs,package.json,package-lock.json,jsconfig.json} "$SC"/
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/optout-browsers"
          test ! -e "$SC/node_modules"
          test ! -e "$PLAYWRIGHT_BROWSERS_PATH"
          set +e
          DUHEM_NO_BROWSER_INSTALL=1 DUHEM_SIDECAR_DIR="$SC" cargo run -p duhem-cli --quiet -- run "${RUNNER_TEMP}/autoprovision.duhem.yml" 2> "${RUNNER_TEMP}/optout.stderr"
          code=$?
          set -e
          cat "${RUNNER_TEMP}/optout.stderr"
          test "$code" -ne 0 || { echo "::error::opt-out still succeeded — auto-provision was not suppressed"; exit 1; }
          grep -q "duhem browser install" "${RUNNER_TEMP}/optout.stderr" \
            || { echo "::error::opt-out did not surface the actionable install hint"; exit 1; }
          test ! -e "$SC/node_modules"
          test ! -e "$PLAYWRIGHT_BROWSERS_PATH"
