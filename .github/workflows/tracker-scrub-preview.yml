# Temporary read-only measurement for #545; removed after importing its counts.
name: tracker policy measurement
on: pull_request
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  measure:
    if: github.head_ref == 'codex/spec-545-tracker-scrub'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Measure both policies without content or URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run -p xtask -- tracker-scrub --measure > tracker-measurement.json
      - uses: actions/upload-artifact@v7
        with:
          name: tracker-policy-counts
          path: tracker-measurement.json
          retention-days: 7
