# Temporary CI generation for #588 under the no-local-build policy.
name: action reference preview
on: pull_request
jobs:
  generate:
    if: github.head_ref == 'codex/spec-588-remove-unused-actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- action-reference
      - uses: actions/upload-artifact@v7
        with:
          name: generated-action-reference
          path: docs/action-reference.md
          retention-days: 7
