# Check totals — worked example (spec #493)
#
# This deliberately non-green run produces one pass, one failure, and
# one inconclusive check. The default reporter therefore finishes with:
#
#   Total: 3 checks · 1 passed · 1 failed · 1 inconclusive
#
# Run it directly when exercising the reporter contract; it is not part
# of the green self-verification manifest because its mixed verdict is
# the behavior under demonstration.

verification: Check-level summary totals
spec_ref: https://github.com/onsager-ai/duhem/issues/493

criteria:
  - id: AC-1
    description: |
      A run reports an executed-check denominator that distinguishes
      passing, failing, and inconclusive checks in the same summary.
    checks:
      - id: AC-1.1
        description: Record one mechanically passing check verdict.
        assertions: ["true"]

      - id: AC-1.2
        description: Record one mechanically failing check verdict.
        assertions: ["false"]

      - id: AC-1.3
        description: Record one check whose command cannot be observed.
        steps:
          - id: unavailable
            uses: cli/invoke
            with:
              command: [./no-such-binary-check-totals-example]
              cwd: .
              timeout: 5s
        assertions: ["true"]
