name: owned process platforms
on:
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/process-platforms.yml']
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/process-platforms.yml']
concurrency:
  group: process-platforms-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  RUSTFLAGS: -D warnings
  # These fixtures bind real loopback listeners; host proxy configuration
  # must not send their requests outside the runner.
  NO_PROXY: 127.0.0.1,localhost
jobs:
  process-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: cargo test -p duhem-runtime --test owned_processes
