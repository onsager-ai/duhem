name: process reference generation (temporary)
on: pull_request
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask --quiet -- action-reference
      - uses: actions/upload-artifact@v7
        with:
          name: process-action-reference
          path: docs/action-reference.md
