verification: Reusable sign-in flow — second consumer
criteria:
  - id: AC-1
    description: The same shared sign-in sequence works from a sibling leaf.
    checks:
      - id: AC-1.1
        steps:
          - uses: ui/navigate
            with:
              url: "data:text/html,<label>Username<input aria-label='Username'></label><label>Password<input aria-label='Password' type='password'></label><button onclick=\"document.querySelector('h1').hidden=false\">Sign In</button><h1 hidden>Welcome</h1>"
          - id: login
            description: Sign in as the second fixture user
            call: sign_in
            with: { user: second@example.com, password: second-secret }
        assertions:
          - $steps.login.outputs.signed_in == true
