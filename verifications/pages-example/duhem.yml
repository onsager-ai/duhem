# Shared `pages:` locator catalog — worked example (#366)
#
# Share a two-level locator catalog through `includes:` and use the same
# entry from sibling leaves. Read `pages.yml` for the catalog, then
# `first/duhem.yml` and `second/duhem.yml` for its consumers.
manifest_version: 1
includes:
  - pages.yml
verifications:
  - path: first/duhem.yml
  - path: parameterized/duhem.yml
  - path: second/duhem.yml
